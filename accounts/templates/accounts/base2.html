{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    {% if title %}
        <title>AlgoStep - {{ title }}</title>

    {% else %}
        <title>AlgoStep</title>

    {% endif %}
    
    <script src="https://kit.fontawesome.com/9c257c67dc.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'dist/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/prism.css' %}">
</head>
<body class="h-full w-full bg-gradient-to-tr from-black via-gray-600 to-black bg-fixed">
    <nav class="bg-gradient-to-r from-sky-950 to-sky-800 py-4 shadow-lg shadow-sky-900 w-full border-b border-sky-900">

        <div class="flex flex-row items-center justify-between">
            <div class="ml-5 space-x-5">
                <a href="{% url 'landing-page' %}"
                   class="text-white font-bold tracking-wider text-lg transition hover:text-sky-300 cursor-pointer mr-15
                          rounded-full bg-sky-900 hover:bg-sky-800 py-2 px-5">
                    Algostep
                </a>

                <a href="{% url 'landing-page' %}"
                    class="text-slate-200 font-semibold transition-colors hover:text-sky-200 cursor-pointer
                           rounded-full hover:bg-slate-500 py-1 px-3">
                    Home <i class="fa-solid fa-house-chimney ml-1 text-amber-600"></i>
                </a>

                <!-- <a href="#"
                    class="text-slate-200 font-semibold transition-colors hover:text-sky-200 cursor-pointer
                           rounded-full hover:bg-slate-500 py-1 px-3">
                    About <i class="fa-solid fa-circle-info ml-1 text-sky-300"></i>
                </a> -->

                <a href="{% url 'resources' %}"
                   class="text-slate-200 font-semibold transition-colors hover:text-sky-200 cursor-pointer
                          rounded-full hover:bg-slate-500 py-1 px-3">
                    Resources <i class="fa-solid fa-book ml-1 text-yellow-500"></i>
                </a>
            </div>

            <div class="flex flex-row items-center mr-5 space-x-7">
                <a href="{% url 'register' %}"
                    class="text-slate-200 font-semibold transition-colors hover:text-sky-200 cursor-pointer">
                    Register <i class="fa-solid fa-person-circle-plus ml-1 text-green-200"></i>
                </a>

                <a href="{% url 'login' %}"
                    class="text-slate-200 font-semibold transition-colors hover:text-emerald-400 cursor-pointer">
                    Login <i class="fa-solid fa-arrow-right-to-bracket ml-1 text-blue-300"></i>
                </a>
            </div>
            
        </div>
        
    </nav>

    {% block content %}{% endblock %}

    <script src="{% static 'js/index.js' %}"></script>
    <script src="{% static 'js/prism.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            Prism.highlightAll();
        });
    </script>
</body>
</html>
