{% extends 'accounts/base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="flex items-center justify-center mt-10">  
    <div class="bg-mist-200 rounded-lg p-5 w-2/3 shadow-around shadow-blue-200">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <h1 class="text-gray-700 text-3xl font-bold tracking-wider mb-5 bg-zinc-300 rounded-full py-2 px-10 w-fit italic">
                Edit Profile
            </h1>
        
            <div class="flex flex-row space-x-10 w-full">
                <fieldset class="space-y-7 w-1/2">
                    {{ user_form|crispy }}
                </fieldset>

                <fieldset class="space-y-7 w-1/2">
                    {{ profile_form|crispy }}
                </fieldset>
            </div>
        
            <div>
                <button type="submit" class="mt-5 bg-emerald-400 rounded-lg py-1 px-3 border-2 border-emerald-500 cursor-pointer text-white font-semibold
                                             transition hover:bg-emerald-600 hover:text-green-200">
                    Save Changes
                </button>

                <a href="{% url 'profile' username=user.username %}" 
                   class="mt-5 bg-red-400 rounded-lg py-1 px-3 border-2 border-red-500 cursor-pointer text-white font-semibold
                          transition hover:bg-red-600 hover:text-red-200">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
